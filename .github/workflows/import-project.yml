name: Import JEJEYYY ARCHIVE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o jejeyyy-archive-autosave-plus-novel.zip -d .
          rm jejeyyy-archive-autosave-plus-novel.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import JEJEYYY ARCHIVE project"
          git push
